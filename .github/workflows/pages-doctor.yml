# CI: clean install, unit tests, config checks, production build, dist checks,
# browser tests.
# Also called by deploy-pages.yml (workflow_call) so production deploys use
# exactly this build-and-verify path. Never deploys by itself.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: "Also upload dist/ as the GitHub Pages artifact (used by deploy-pages.yml)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Called from a deploy, github.workflow is the caller's name, so this group
  # never cancels a release build.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_BASE: "/${{ github.event.repository.name }}/"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node (from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Toolchain versions
        run: |
          node --version
          npm --version

      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Config checks
        run: node scripts/verify-build.mjs config --require-clean

      - name: Build
        run: npm run build

      - name: Dist checks
        run: node scripts/verify-build.mjs dist

      # Browser tests run against dist/ served like GitHub Pages (scripts/pages-server.mjs).
      # Each test uses a fresh, isolated browser context with synthetic data only.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests (Playwright)
        run: npx playwright test

      - name: Upload Playwright report (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload dist (review artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload GitHub Pages artifact
        if: ${{ inputs.upload-pages-artifact }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
